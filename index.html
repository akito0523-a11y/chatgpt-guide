gin:0 0 10px}\n  h3{font-size:18px;margin:20px 0 8px}\n  p{margin:8px 0}\n  .lead{font-size:17px}\n  .big{\n    font-size:22px;font-weight:800;text-align:center;\n    padding:18px 10px;background:var(--soft);border-radius:16px;margin:14px 0\n  }\n\n  .flow{display:grid;gap:10px;margin:18px 0 4px}\n  .step{\n    border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 58px;\n    position:relative;background:#fff;\n  }\n  .step .num{\n    position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;\n    display:grid;place-items:center;background:#111827;color:#fff;font-weight:800\n  }\n  .step b{display:block;font-size:17px}\n  .arrow{text-align:center;font-size:22px;color:#9ca3af;line-height:1}\n\n  .chat{display:grid;gap:10px;margin-top:12px}\n  .bubble{\n    max-width:92%;padding:12px 14px;border-radius:16px;font-size:15px;\n  }\n  .you{justify-self:end;background:#111827;color:#fff;border-bottom-right-radius:5px}\n  .ai{justify-self:start;background:#f3f4f6;border-bottom-left-radius:5px}\n  .tag{font-size:11px;font-weight:800;opacity:.65;display:block;margin-bottom:2px}\n\n  .usegrid{display:grid;gap:10px}\n  .usecase{\n    border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff\n  }\n  .usecase .head{\n    display:flex;align-items:flex-start;gap:10px;margin-bottom:8px\n  }\n  .numicon{\n    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;\n    background:var(--taxi);font-size:20px;flex:0 0 auto\n  }\n  .usecase h3{margin:0;font-size:17px}\n  .usecase p{font-size:14px;color:#4b5563;margin:4px 0}\n  .prompt{\n    background:#111827;color:#fff;border-radius:14px;padding:13px;\n    white-space:pre-wrap;font-size:14px;margin-top:10px\n  }\n\n  .beforeafter{\n    display:grid;gap:8px;margin-top:12px\n  }\n  .ba{\n    border-radius:14px;padding:12px 13px\n  }\n  .before{background:#f9fafb;border:1px solid var(--line)}\n  .after{background:var(--ok)}\n  .ba b{display:block;font-size:13px;margin-bottom:4px}\n\n  .good,.caution,.note{\n    padding:14px;border-radius:15px;margin:10px 0;\n  }\n  .good{background:var(--ok)}\n  .caution{background:var(--warn)}\n  .note{background:var(--blue)}\n  .good b,.caution b,.note b{display:block;margin-bottom:4px}\n\n  .formula{\n    display:grid;grid-template-columns:1fr;gap:8px;margin:14px 0\n  }\n  .formula div{\n    padding:12px;border-radius:13px;background:var(--blue);font-weight:700;text-align:center\n  }\n  .plus{text-align:center;background:none!important;padding:0!important;color:#9ca3af}\n\n  .grid2{display:grid;gap:10px}\n  .cardmini{\n    border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff\n  }\n  .cardmini b{display:block}\n  ul{padding-left:1.2em;margin:8px 0}\n  li{margin:7px 0}\n\n  .compare{\n    width:100%;border-collapse:separate;border-spacing:0 8px;font-size:14px\n  }\n  .compare th{\n    text-align:left;color:#6b7280;font-size:12px;padding:0 8px\n  }\n  .compare td{\n    background:#f9fafb;padding:11px 8px;vertical-align:top\n  }\n  .compare td:first-child{border-radius:12px 0 0 12px;font-weight:700;width:32%}\n  .compare td:last-child{border-radius:0 12px 12px 0}\n\n  .summary{\n    background:#111827;color:white;border:none;\n  }\n  .summary h2{color:#fff}\n  .summary ol{padding-left:1.3em}\n  .summary li{margin:9px 0}\n  .foot{text-align:center;color:var(--muted);font-size:12px;padding:12px 6px}\n  .icon{\n    width:48px;height:48px;border-radius:14px;background:#f3f4f6;\n    display:grid;place-items:center;font-size:24px;margin-bottom:8px\n  }\n  .taxibox{\n    background:linear-gradient(145deg,#fff8d8,#fffdf2);\n    border:1px solid #f3e8a3;\n    border-radius:18px;padding:16px;margin-top:12px\n  }\n  .taxibox strong{font-size:18px}\n  @media(min-width:620px){\n    .wrap{padding-left:20px;padding-right:20px}\n    .hero{margin-left:-20px;margin-right:-20px;padding:42px 32px}\n    .grid2,.usegrid{grid-template-columns:1fr 1fr}\n    .formula{grid-template-columns:1fr auto 1fr auto 1fr;align-items:center}\n    .plus{font-size:22px}\n  }\n  @media print{\n    body{background:white}\n    .wrap{max-width:none}\n    section{box-shadow:none;break-inside:avoid}\n    .toc{display:none}\n  }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n\n  <header class=\"hero\">\n    <div class=\"eyebrow\">タクシー会社向け・超入門 Version 2</div>\n    <h1>チャッピーを<br>仕事でどう使う？</h1>\n    <p>「何が便利なのか」を、タクシーの仕事に置き換えて説明します。</p>\n    <span class=\"mini\">スマホで5分程度・社内共有向け</span>\n  </header>\n\n  <nav class=\"toc\">\n    <a href=\"#basic\">まずこれだけ</a>\n    <a href=\"#taxiuse\">タクシーでの使い方</a>\n    <a href=\"#report\">日報・報告書</a>\n    <a href=\"#customer\">接客・外国語</a>\n    <a href=\"#analysis\">売上・需要分析</a>\n    <a href=\"#care\">注意点</a>\n  </nav>\n\n  <section id=\"basic\">\n    <div class=\"icon\">💬</div>\n    <h2>まず覚えることは1つだけ</h2>\n    <p class=\"lead\">チャッピーは、<b>「何でも知っている機械」ではなく、「一緒に考えてくれる助手」</b>です。</p>\n    <div class=\"big\">調べる ＋ まとめる ＋ 書く ＋ 比べる</div>\n\n    <div class=\"taxibox\">\n      <strong>タクシーの仕事なら…</strong>\n      <p>「この日報を読みやすくして」<br>\n      「この観光地をお客さん向けに説明して」<br>\n      「今日の売上を一緒に振り返って」</p>\n      <p>こんな普通の言い方で十分です。</p>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"icon\">👆</div>\n    <h2>使い方は3ステップ</h2>\n    <div class=\"flow\">\n      <div class=\"step\"><span class=\"num\">1</span><b>やってほしいことを書く</b>難しい言葉は不要。普段の話し方でOK。</div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"step\"><span class=\"num\">2</span><b>答えを見る</b>違っていたら「そこ違う」と言えば直せます。</div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"step\"><span class=\"num\">3</span><b>もっと良くする</b>「短く」「丁寧に」「表にして」など追加注文。</div>\n    </div>\n  </section>\n\n  <section id=\"taxiuse\">\n    <div class=\"icon\">🚕</div>\n    <h2>タクシー会社で使える8つの例</h2>\n    <div class=\"usegrid\">\n\n      <div class=\"usecase\">\n        <div class=\"head\"><div class=\"numicon\">📝</div><div><h3>1. 日報を整える</h3><p>メモ書きを、読みやすい文章に直す。</p></div></div>\n        <div class=\"prompt\">今日の営業内容を日報用に、短く丁寧にまとめて。</div>\n      </div>\n\n      <div class=\"usecase\">\n        <div class=\"head\"><div class=\"numicon\">⚠️</div><div><h3>2. 事故・トラブル報告</h3><p>感情を抜いて、事実関係を整理する。</p></div></div>\n        <div class=\"prompt\">このメモを、時系列で分かる事故報告書の形にして。</div>\n      </div>\n\n      <div class=\"usecase\">\n        <div class=\"head\"><div class=\"numicon\">🙇</div><div><h3>3. お客様への説明文</h3><p>丁寧な言い方や、お詫び文を考える。</p></div></div>\n        <div class=\"prompt\">お客様に失礼のない、柔らかい説明文に直して。</div>\n      </div>\n\n      <div class=\"usecase\">\n        <div class=\"head\"><div class=\"numicon\">🌏</div><div><h3>4. 外国語対応</h3><p>英語・中国語などの接客表現を作る。</p></div></div>\n        <div class=\"prompt\">「高速道路を使いますか？」を英語で、簡単な言い方にして。</div>\n      </div>\n\n      <div class=\"usecase\">\n        <div class=\"head\"><div class=\"numicon\">🗼</div><div><h3>5. 観光案内</h3><p>観光地の特徴を短く説明できる。</p></div></div>\n        <div class=\"prompt\">浅草寺を外国人観光客に30秒で説明できる文章を作って。</div>\n      </div>\n\n      <div class=\"usecase\">\n        <div class=\"head\"><div class=\"numicon\">📊</div><div><h3>6. 売上の振り返り</h3><p>数字を見せて、良かった点・改善点を整理。</p></div></div>\n        <div class=\"prompt\">今日の売上と営業回数から、良かった点と改善点を3つずつ出して。</div>\n      </div>\n\n      <div class=\"usecase\">\n        <div class=\"head\"><div class=\"numicon\">📍</div><div><h3>7. 営業エリアの作戦</h3><p>時間帯・天気・イベントから狙い目を考える。</p></div></div>\n        <div class=\"prompt\">雨の金曜20時、都内で需要が出そうな場所を理由付きで考えて。</div>\n      </div>\n\n      <div class=\"usecase\">\n        <div class=\"head\"><div class=\"numicon\">🎓</div><div><h3>8. 新人教育</h3><p>接客・地理・ルールをクイズ形式にもできる。</p></div></div>\n        <div class=\"prompt\">新人乗務員向けに、接客マナーのクイズを5問作って。</div>\n      </div>\n\n    </div>\n  </section>\n\n  <section id=\"report\">\n    <div class=\"icon\">🧾</div>\n    <h2>日報・報告書は特に相性が良い</h2>\n    <p>走りながら考えたことを、きれいな文章にする作業はチャッピーが得意です。</p>\n\n    <div class=\"beforeafter\">\n      <div class=\"ba before\">\n        <b>入力するメモ</b>\n        18時ごろ新宿で渋滞。お客さんに迂回を説明。少し時間かかった。クレームなし。\n      </div>\n      <div class=\"ba after\">\n        <b>チャッピーに整えてもらうと</b>\n        18時頃、新宿周辺で交通渋滞が発生。お客様へ迂回経路をご説明し、了承をいただいた上で運行しました。通常より所要時間を要しましたが、特段のトラブルはありませんでした。\n      </div>\n    </div>\n\n    <div class=\"note\">\n      <b>ポイント</b>\n      「事実だけ」「時系列で」「感情を入れずに」と頼むと、報告書向けになります。\n    </div>\n  </section>\n\n  <section id=\"customer\">\n    <div class=\"icon\">🌏</div>\n    <h2>接客・外国語対応にも便利</h2>\n    <div class=\"grid2\">\n      <div class=\"cardmini\">\n        <b>英語のひとこと</b>\n        「高速道路を使ってもよろしいですか？」<br>\n        → 短く自然な英語にしてもらう\n      </div>\n      <div class=\"cardmini\">\n        <b>観光説明</b>\n        「東京タワーとスカイツリーの違いを30秒で説明して」\n      </div>\n      <div class=\"cardmini\">\n        <b>丁寧な言い換え</b>\n        「この言い方だと強いので、柔らかくして」\n      </div>\n      <div class=\"cardmini\">\n        <b>聞き取り補助</b>\n        写真や文章を見せて「何と書いてある？」と確認する\n      </div>\n    </div>\n\n    <div class=\"chat\">\n      <div class=\"bubble you\"><span class=\"tag\">あなた</span>「この道は混んでいるので別ルートにします」を簡単な英語にして。</div>\n      <div class=\"bubble ai\"><span class=\"tag\">チャッピー</span>This road is crowded, so I’ll take another route.</div>\n      <div class=\"bubble you\"><span class=\"tag\">あなた</span>もっと短く、言いやすくして。</div>\n      <div class=\"bubble ai\"><span class=\"tag\">チャッピー</span>Traffic is heavy, so I’ll take another way.</div>\n    </div>\n  </section>\n\n  <section id=\"analysis\">\n    <div class=\"icon\">📈</div>\n    <h2>売上・需要の振り返りにも使える</h2>\n    <p>数字や営業メモを入れると、傾向を整理したり、次回の作戦を考える補助になります。</p>\n\n    <table class=\"compare\">\n      <thead>\n        <tr><th>入力するもの</th><th>できること</th></tr>\n      </thead>\n      <tbody>\n        <tr><td>時間帯別売上</td><td>稼げた時間・弱かった時間を整理</td></tr>\n        <tr><td>乗車エリア</td><td>営業エリアごとの傾向を比較</td></tr>\n        <tr><td>天気・曜日</td><td>需要が変わった理由を考える</td></tr>\n        <tr><td>イベント情報</td><td>需要が出そうな場所の候補を作る</td></tr>\n      </tbody>\n    </table>\n\n    <div class=\"prompt\">今日の売上は税込82,000円。\n15〜18時は弱く、22〜1時が好調。\nこの結果から、次回の営業で試すことを3つ考えて。</div>\n\n    <div class=\"caution\">\n      <b>重要</b>\n      リアルタイムの渋滞・イベント・交通規制などは、最新情報の確認が必要です。チャッピーの答えだけで決めず、配車アプリや交通情報と組み合わせます。\n    </div>\n  </section>\n\n  <section>\n    <div class=\"icon\">🎯</div>\n    <h2>上手な頼み方</h2>\n    <p>次の3つを入れるだけで、答えがかなり使いやすくなります。</p>\n\n    <div class=\"formula\">\n      <div>何をしてほしい？</div>\n      <div class=\"plus\">＋</div>\n      <div>誰向け？</div>\n      <div class=\"plus\">＋</div>\n      <div>どんな形？</div>\n    </div>\n\n    <div class=\"prompt\">この内容を、\n営業所長に提出する日報として、\n150文字くらいで、事実だけにして。</div>\n\n    <div class=\"good\">\n      <b>便利な追加注文</b>\n      「もっと短く」／「箇条書きで」／「丁寧に」／「時系列で」／「専門用語なしで」／「3案出して」\n    </div>\n  </section>\n\n  <section id=\"care\">\n    <div class=\"icon\">⚠️</div>\n    <h2>タクシー会社で特に注意すること</h2>\n\n    <div class=\"caution\">\n      <b>① お客様の個人情報を入れない</b>\n      氏名、電話番号、自宅住所、予約情報などはそのまま入力しない。\n    </div>\n\n    <div class=\"caution\">\n      <b>② 会社の機密情報をむやみに入れない</b>\n      社内限定資料、顧客リスト、未公開の数字などは会社のルールを確認する。\n    </div>\n\n    <div class=\"caution\">\n      <b>③ 法律・運賃・事故対応は必ず確認</b>\n      AIの回答は間違うことがあります。社内規定や正式な資料を優先します。\n    </div>\n\n    <div class=\"caution\">\n      <b>④ 運転中は操作しない</b>\n      入力や確認は必ず停車中、安全な場所で行います。\n    </div>\n  </section>\n\n  <section class=\"summary\">\n    <h2>結局、何に使えばいい？</h2>\n    <ol>\n      <li><b>文章を作る・直す</b> → 日報、報告書、案内文</li>\n      <li><b>説明してもらう</b> → 地理、観光、外国語</li>\n      <li><b>一緒に考える</b> → 売上分析、営業作戦、教育</li>\n      <li><b>最後は人が確認する</b> → 重要事項は必ずチェック</li>\n    </ol>\n  </section>\n\n  <div class=\"foot\">\n    はじめてのChatGPT説明用ミニガイド<br>\n    タクシー会社向け Version 2 / スマホ閲覧用\n  </div>\n\n</div>\n</body>\n</html>\n"
};
function show(n){
  document.getElementById('viewer').srcdoc = pages[n];
  document.getElementById('b1').classList.toggle('active', n===1);
  document.getElementById('b2').classList.toggle('active', n===2);
  window.scrollTo(0,0);
}
show(1);
</script>
</body>
